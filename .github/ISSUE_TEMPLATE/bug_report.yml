name: Bug report
description: Something in the app is wrong or broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open order ORD/2026-27/0012
        2. Record a return of 5 props
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Shop PC (production)
        - VPS (production)
        - Dev server
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Signed in as
      options:
        - Admin
        - Staff
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or error message
      description: Never paste passwords or customer ID-proof numbers.
