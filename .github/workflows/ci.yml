name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

# One run per branch/PR; a new push cancels the outdated run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI-only throwaway values. Real secrets never live in the repository.
  DATABASE_URL: postgresql://rms:rms@localhost:5432/rms_test
  TEST_DATABASE_URL: postgresql://rms:rms@localhost:5432/rms_test
  AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
  COOKIE_SECURE: "false"
  APP_TIMEZONE: Asia/Kolkata
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rms
          POSTGRES_PASSWORD: rms
          POSTGRES_DB: rms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rms -d rms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Migrations apply cleanly
        run: npx prisma migrate deploy
      - name: Unit & service tests (Vitest)
        run: npm test

  e2e:
    name: End-to-end tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rms
          POSTGRES_PASSWORD: rms
          POSTGRES_DB: rms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rms -d rms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
